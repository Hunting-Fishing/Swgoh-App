name: Cloudflare Worker Verify

# Manual-only by design. Production delivery does not depend on GitHub-hosted
# runners; this verification remains available on demand without auto-spending.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bundle Worker without deploying
        run: npx --yes wrangler@4.125.0 deploy --dry-run --outdir .wrangler-dry-run
